<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Market POS</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f6f8;margin:0;color:#222}header{background:#111827;color:#fff;padding:16px 22px;display:flex;justify-content:space-between}main{max-width:1200px;margin:20px auto;padding:0 15px}.card{background:#fff;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #0001}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:8px;padding:10px 14px;cursor:pointer;background:#2563eb;color:#fff}.gray{background:#6b7280}input{padding:10px;border:1px solid #d1d5db;border-radius:8px;width:100%;box-sizing:border-box;margin:5px 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}.hidden{display:none}.danger{color:#dc2626;font-weight:bold}.ok{color:#15803d}.stat{font-size:24px;font-weight:bold}#login{max-width:420px;margin:70px auto}
</style>
</head>
<body>
<header><b>🛒 Mini Market POS</b><span id="status">غير متصل</span></header>
<section id="login" class="card"><h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="الإيميل"><input id="password" type="password" placeholder="كلمة المرور"><button onclick="login()">دخول</button><p id="loginMsg"></p></section>
<main id="app" class="hidden">
<nav><button onclick="show('dashboard')">الرئيسية</button><button onclick="show('products')">المنتجات</button><button onclick="show('purchase')">شراء / إضافة مخزون</button><button onclick="show('sale')">البيع</button><button onclick="show('reports')">التقارير</button><button class="gray" onclick="logout()">خروج</button></nav>
<section id="dashboard" class="page card"><h2>الرئيسية</h2><div class="grid"><div class="card">عدد المنتجات<div class="stat" id="sProducts">0</div></div><div class="card">قيمة المخزون<div class="stat" id="sStock">0</div></div><div class="card">منتجات تحتاج شراء<div class="stat" id="sLow">0</div></div></div></section>
<section id="products" class="page card hidden"><h2>المنتجات</h2><div class="grid"><input id="pBarcode" placeholder="الباركود"><input id="pName" placeholder="اسم المنتج"><input id="pCategory" placeholder="الفئة"><input id="pCost" type="number" step="0.01" placeholder="سعر الشراء"><input id="pSell" type="number" step="0.01" placeholder="سعر البيع"><input id="pStock" type="number" placeholder="الكمية الحالية"><input id="pMin" type="number" placeholder="الحد الأدنى" value="5"></div><button onclick="addProduct()">إضافة المنتج</button><input id="productSearch" placeholder="بحث بالاسم أو الباركود" oninput="renderProducts()"><div style="overflow:auto"><table><thead><tr><th>الباركود</th><th>المنتج</th><th>الفئة</th><th>شراء</th><th>بيع</th><th>المخزون</th><th>الحالة</th></tr></thead><tbody id="productRows"></tbody></table></div></section>
<section id="purchase" class="page card hidden"><h2>إضافة مخزون / شراء</h2><input id="buyBarcode" placeholder="الباركود"><input id="buyQty" type="number" placeholder="الكمية"><input id="buyCost" type="number" step="0.01" placeholder="سعر الشراء"><button onclick="purchase()">إضافة للمخزون</button><p id="buyMsg"></p></section>
<section id="sale" class="page card hidden"><h2>البيع</h2><input id="saleBarcode" placeholder="امسحي الباركود أو اكتبيه ثم Enter" onkeydown="if(event.key==='Enter')addSaleItem()"><div style="overflow:auto"><table><thead><tr><th>المنتج</th><th>السعر</th><th>الكمية</th><th>الإجمالي</th></tr></thead><tbody id="saleRows"></tbody></table></div><h3>الإجمالي: <span id="saleTotal">0.00</span> جنيه</h3><button onclick="completeSale()">إتمام البيع</button><button class="gray" onclick="clearCart()">إلغاء</button><p id="saleMsg"></p></section>
<section id="reports" class="page card hidden"><h2>التقارير</h2><button onclick="loadSales()">تحديث</button><div style="overflow:auto"><table><thead><tr><th>التاريخ</th><th>الإجمالي</th><th>طريقة الدفع</th></tr></thead><tbody id="salesRows"></tbody></table></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://xagjgrfoiszczsmncwch.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="PASTE_NEW_PUBLISHABLE_KEY_HERE";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let products=[],cart=[];
async function login(){const{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});loginMsg.textContent=error?error.message:""}
async function logout(){await sb.auth.signOut();location.reload()}
function show(id){document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");if(id==="products")renderProducts();if(id==="dashboard")dashboard();if(id==="reports")loadSales()}
async function loadProducts(){const{data,error}=await sb.from("products").select("*").order("name");if(error){status.textContent="خطأ اتصال";return}products=data||[];status.textContent="متصل ✓";dashboard();renderProducts()}
function dashboard(){sProducts.textContent=products.length;sStock.textContent=products.reduce((a,p)=>a+Number(p.stock)*Number(p.cost_price),0).toFixed(2);sLow.textContent=products.filter(p=>Number(p.stock)<=Number(p.min_stock)).length}
function renderProducts(){const q=(productSearch.value||"").toLowerCase();productRows.innerHTML=products.filter(p=>(p.name||"").toLowerCase().includes(q)||(p.barcode||"").toLowerCase().includes(q)).map(p=>`<tr><td>${p.barcode||""}</td><td>${p.name}</td><td>${p.category||""}</td><td>${Number(p.cost_price).toFixed(2)}</td><td>${Number(p.sell_price).toFixed(2)}</td><td>${p.stock}</td><td class="${p.stock<=p.min_stock?"danger":"ok"}">${p.stock<=p.min_stock?"يحتاج شراء":"جيد"}</td></tr>`).join("")}
async function addProduct(){const obj={barcode:pBarcode.value.trim()||null,name:pName.value.trim(),category:pCategory.value.trim()||"عام",cost_price:Number(pCost.value||0),sell_price:Number(pSell.value||0),stock:Number(pStock.value||0),min_stock:Number(pMin.value||5)};if(!obj.name)return alert("اكتبي اسم المنتج");const{error}=await sb.from("products").insert(obj);if(error)return alert(error.message);["pBarcode","pName","pCategory","pCost","pSell","pStock"].forEach(id=>document.getElementById(id).value="");pMin.value=5;await loadProducts()}
async function purchase(){const p=products.find(x=>x.barcode===buyBarcode.value.trim()),qty=Number(buyQty.value);if(!p)return buyMsg.textContent="المنتج غير موجود";if(!qty||qty<1)return buyMsg.textContent="اكتبي كمية صحيحة";const cost=Number(buyCost.value||p.cost_price);const{error}=await sb.from("products").update({stock:p.stock+qty,cost_price:cost}).eq("id",p.id);if(error)return buyMsg.textContent=error.message;await sb.from("stock_movements").insert({product_id:p.id,type:"purchase",quantity:qty,unit_cost:cost});buyMsg.textContent="تمت إضافة المخزون ✓";buyBarcode.value="";buyQty.value="";buyCost.value="";await loadProducts()}
function addSaleItem(){const p=products.find(x=>x.barcode===saleBarcode.value.trim());if(!p)return saleMsg.textContent="المنتج غير موجود";if(p.stock<=0)return saleMsg.textContent="المخزون صفر";const old=cart.find(x=>x.product.id===p.id);if(old){if(old.qty<p.stock)old.qty++}else cart.push({product:p,qty:1});saleBarcode.value="";saleMsg.textContent="";renderCart()}
function renderCart(){saleRows.innerHTML=cart.map(x=>`<tr><td>${x.product.name}</td><td>${Number(x.product.sell_price).toFixed(2)}</td><td><button onclick="changeQty('${x.product.id}',-1)">-</button> ${x.qty} <button onclick="changeQty('${x.product.id}',1)">+</button></td><td>${(x.qty*x.product.sell_price).toFixed(2)}</td></tr>`).join("");saleTotal.textContent=cart.reduce((a,x)=>a+x.qty*x.product.sell_price,0).toFixed(2)}
function changeQty(id,d){const x=cart.find(a=>a.product.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(a=>a.product.id!==id);if(x.qty>x.product.stock)x.qty=x.product.stock;renderCart()}
function clearCart(){cart=[];renderCart();saleMsg.textContent=""}
async function completeSale(){if(!cart.length)return;const total=cart.reduce((a,x)=>a+x.qty*x.product.sell_price,0);const{data:s,error:e}=await sb.from("sales").insert({total,payment_method:"cash"}).select().single();if(e)return saleMsg.textContent=e.message;const{error:e2}=await sb.from("sale_items").insert(cart.map(x=>({sale_id:s.id,product_id:x.product.id,quantity:x.qty,unit_price:x.product.sell_price})));if(e2)return saleMsg.textContent=e2.message;for(const x of cart){await sb.from("products").update({stock:x.product.stock-x.qty}).eq("id",x.product.id);await sb.from("stock_movements").insert({product_id:x.product.id,type:"sale",quantity:-x.qty,unit_cost:x.product.cost_price})}saleMsg.textContent="تم البيع بنجاح ✓";clearCart();await loadProducts()}
async function loadSales(){const{data}=await sb.from("sales").select("*").order("created_at",{ascending:false}).limit(100);salesRows.innerHTML=(data||[]).map(s=>`<tr><td>${new Date(s.created_at).toLocaleString("ar-EG")}</td><td>${Number(s.total).toFixed(2)}</td><td>${s.payment_method}</td></tr>`).join("")}
sb.auth.getSession().then(({data})=>{if(data.session){login.classList.add("hidden");app.classList.remove("hidden");loadProducts()}})
</script>
</body></html>
